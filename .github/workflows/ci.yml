name: OpenTofu CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: quiquecmtt/reusable-workflows/.github/workflows/opentofu-ci.yml@main
    with:
      enable_security_scan: true
      enable_docs: true
      allowed_pr_author: "quiquecmtt"
    permissions:
      content: write
